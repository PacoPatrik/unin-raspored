<!doctype html>
<html lang="hr" data-bs-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#10111A">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>UNIN Raspored & Putovanja</title>
</head>
<body>
    <div class="app-container">
        <!-- Zaglavlje aplikacije (Glassmorphism) -->
        <header class="app-header glass-effect shadow-sm">
            <div class="container-xl d-flex justify-content-between align-items-center py-2">
                <h1 class="h6 mb-0 text-truncate fw-bold">
                    <i class="bi bi-mortarboard-fill text-primary me-2"></i>
                    <span>Elektrotehnika (3. god)</span>
                </h1>
                <div class="d-flex align-items-center gap-2">
                    <!-- Odabir Grupe za laboratorijske vježbe -->
                    <select id="groupSelect" class="form-select form-select-sm group-badge-select">
                        <option value="Sve grupe">Sve Grupe</option>
                        <option value="Grupa A">Grupa A</option>
                        <option value="Grupa B">Grupa B</option>
                        <option value="Grupa C">Grupa C</option>
                    </select>
                    <button type="button" class="btn theme-button" id="theme-toggle-button" title="Promijeni temu">
                        <i class="bi bi-brightness-high-fill"></i>
                    </button>
                </div>
            </div>
        </header>

        <!-- Glavni sadržaj -->
        <main class="container-xl content-body py-4">
            <!-- Navigacija Danima i Info ruta -->
            <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
                <div class="btn-group day-picker glass-effect p-1" role="group">
                    <button type="button" class="btn btn-sm btn-outline-secondary active" id="btn-today">Danas</button>
                    <button type="button" class="btn btn-sm btn-outline-secondary" id="btn-tomorrow">Sutra</button>
                    <button type="button" class="btn btn-sm btn-outline-secondary" id="btn-week">Cijeli Tjedan</button>
                </div>
                <div class="route-badge">
                    <i class="bi bi-train-front text-primary me-1"></i> Ludbreg ⇄ Varaždin
                    <span class="badge bg-secondary ms-1">30 min hod</span>
                </div>
            </div>

            <!-- Kartice Tranzita (Plan putovanja) -->
            <div class="row g-3 mb-4">
                <!-- Odlazak na faks -->
                <div class="col-md-6">
                    <div class="glass-effect p-3 rounded-4 transit-card h-100 border-start border-4 border-success">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <h6 class="fw-bold mb-0 text-success">
                                <i class="bi bi-arrow-right-circle-fill me-1"></i> Odlazak na predavanja
                            </h6>
                            <span class="badge bg-success-subtle text-success">Za 1. predavanje</span>
                        </div>
                        <div id="morning-transit-info">
                            <div class="spinner-border spinner-border-sm text-secondary" role="status"></div> Učitavanje voznog reda...
                        </div>
                    </div>
                </div>

                <!-- Povratak s faksa -->
                <div class="col-md-6">
                    <div class="glass-effect p-3 rounded-4 transit-card h-100 border-start border-4 border-info">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <h6 class="fw-bold mb-0 text-info">
                                <i class="bi bi-arrow-left-circle-fill me-1"></i> Povratak za Ludbreg
                            </h6>
                            <span class="badge bg-info-subtle text-info">Nakon zadnjeg sata</span>
                        </div>
                        <div id="evening-transit-info">
                            <div class="spinner-border spinner-border-sm text-secondary" role="status"></div> Učitavanje voznog reda...
                        </div>
                    </div>
                </div>
            </div>

            <!-- Naslov sekcije rasporeda -->
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="fw-bold mb-0">
                    <i class="bi bi-calendar3 me-2 text-primary"></i>
                    <span id="schedule-day-title">Današnji Raspored</span>
                </h5>
                <span id="sync-status" class="badge bg-dark-subtle text-muted">Ažurirano s UNIN-a</span>
            </div>

            <!-- Popis Predavanja -->
            <div id="schedule-container" class="row g-3">
                <!-- JS ovdje generira kartice predavanja -->
            </div>
        </main>
    </div>

    <!-- Skripte -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <script src="app.js"></script>
</body>
</html>
