<!doctype html>
<html lang="hr" data-bs-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#10111A">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>UNIN 3. Godina | Raspored & Vlakovi</title>
</head>
<body>
    <div class="app-container">
        <!-- Zaglavlje -->
        <header class="app-header glass-effect shadow-sm">
            <div class="container-xl d-flex justify-content-between align-items-center py-2">
                <div>
                    <h1 class="h6 mb-0 fw-bold">
                        <i class="bi bi-mortarboard-fill text-primary me-2"></i>Elektrotehnika (3. god)
                    </h1>
                    <small class="text-muted d-none d-sm-inline">Sveučilišni centar Varaždin</small>
                </div>
                <div class="d-flex align-items-center gap-2">
                    <span class="small text-muted d-none d-md-inline">Moja grupa:</span>
                    <select id="groupSelect" class="form-select form-select-sm group-badge-select">
                        <option value="Sve">Sve grupe</option>
                        <option value="A">Grupa A</option>
                        <option value="B">Grupa B</option>
                        <option value="C">Grupa C</option>
                    </select>
                </div>
            </div>
        </header>

        <main class="container-xl content-body py-3">
            <!-- Izbor Tjedna i Dana -->
            <div class="glass-effect p-3 rounded-4 mb-4">
                <div class="row g-2 align-items-center">
                    <div class="col-md-5">
                        <label for="weekSelect" class="form-label small text-muted mb-1">Odaberi tjedan semestra:</label>
                        <select id="weekSelect" class="form-select form-select-sm"></select>
                    </div>
                    <div class="col-md-7">
                        <label class="form-label small text-muted mb-1">Odaberi dan:</label>
                        <div class="btn-group w-100 day-picker" role="group" id="dayButtons">
                            <button type="button" class="btn btn-sm btn-outline-secondary" data-day="0">Pon</button>
                            <button type="button" class="btn btn-sm btn-outline-secondary" data-day="1">Uto</button>
                            <button type="button" class="btn btn-sm btn-outline-secondary" data-day="2">Sri</button>
                            <button type="button" class="btn btn-sm btn-outline-secondary" data-day="3">Čet</button>
                            <button type="button" class="btn btn-sm btn-outline-secondary" data-day="4">Pet</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Preporučeni vlakovi za taj dan -->
            <div class="row g-3 mb-4">
                <!-- Odlazak Ludbreg -> Varaždin -->
                <div class="col-md-6">
                    <div class="glass-effect p-3 rounded-4 transit-card h-100 border-start border-4 border-success">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <span class="fw-bold text-success">
                                <i class="bi bi-train-front-fill me-1"></i> Odlazak: Ludbreg ➔ Varaždin
                            </span>
                            <span id="badge-morning-target" class="badge bg-success-subtle text-success"></span>
                        </div>
                        <div id="morning-train-result"></div>
                    </div>
                </div>

                <!-- Povratak Varaždin -> Ludbreg -->
                <div class="col-md-6">
                    <div class="glass-effect p-3 rounded-4 transit-card h-100 border-start border-4 border-info">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <span class="fw-bold text-info">
                                <i class="bi bi-train-front-fill me-1"></i> Povratak: Varaždin ➔ Ludbreg
                            </span>
                            <span id="badge-evening-target" class="badge bg-info-subtle text-info"></span>
                        </div>
                        <div id="evening-train-result"></div>
                    </div>
                </div>
            </div>

            <!-- Prikaz rasporeda predavanja -->
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="fw-bold mb-0" id="current-day-label">Raspored Predavanja</h5>
                <span id="total-lectures-count" class="badge bg-primary">0 predavanja</span>
            </div>

            <div id="lectures-container" class="row g-3"></div>

            <!-- Kompletan popis svih vlakova -->
            <div class="accordion mt-4" id="timetableAccordion">
                <div class="accordion-item glass-effect">
                    <h2 class="accordion-header">
                        <button class="accordion-button collapsed bg-transparent text-light" type="button" data-bs-toggle="collapse" data-bs-target="#collapseTimetable">
                            <i class="bi bi-clock-history me-2 text-warning"></i> Cjelokupni vozni red vlakova (Ludbreg ⇄ Varaždin)
                        </button>
                    </h2>
                    <div id="collapseTimetable" class="accordion-collapse collapse" data-bs-parent="#timetableAccordion">
                        <div class="accordion-body">
                            <div class="row">
                                <div class="col-md-6">
                                    <h6 class="text-success fw-bold">Ludbreg ➔ Varaždin:</h6>
                                    <ul class="list-group list-group-flush small" id="all-trains-l2v"></ul>
                                </div>
                                <div class="col-md-6 mt-3 mt-md-0">
                                    <h6 class="text-info fw-bold">Varaždin ➔ Ludbreg:</h6>
                                    <ul class="list-group list-group-flush small" id="all-trains-v2l"></ul>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
