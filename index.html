<!doctype html>
<html lang="hr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f1115">
    <title>Raspored · Elektrotehnika 3. godina</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
    <div class="wrap top-in">
        <div>
            <div class="brand">Raspored</div>
            <div class="sub">Sveučilište Sjever · Elektrotehnika · 3. godina</div>
        </div>
        <div class="seg" id="group-buttons" aria-label="Grupa">
            <button class="grp-btn" data-grp="Sve">Sve</button>
            <button class="grp-btn" data-grp="A">A</button>
            <button class="grp-btn" data-grp="B">B</button>
            <button class="grp-btn" data-grp="C">C</button>
        </div>
    </div>
</header>

<main class="wrap">
    <section class="weekbar">
        <button class="icon-btn" id="prev" aria-label="Prethodni tjedan">‹</button>
        <select id="week-select" aria-label="Tjedan"></select>
        <button class="icon-btn" id="next" aria-label="Sljedeći tjedan">›</button>
        <button class="ghost" id="today">Danas</button>
    </section>

    <nav class="days" id="days-nav"></nav>

    <div class="seg view-switch" id="view-switch">
        <button data-view="day" class="active">Dan</button>
        <button data-view="week">Cijeli tjedan</button>
    </div>

    <div id="view-day">
        <div class="dayhead">
            <h1 id="day-title"></h1>
            <span id="day-meta"></span>
        </div>
        <div id="lectures-list"></div>

        <section id="transit-section">
            <h2>Vlakovi · Ludbreg ⇄ Varaždin <small>30 min pješice do fakulteta</small></h2>
            <div class="transit" id="transit"></div>
        </section>
    </div>

    <div id="view-week" hidden></div>

    <details class="all">
        <summary>Cijeli vozni red</summary>
        <div class="all-grid">
            <div><h3>Ludbreg → Varaždin</h3><div id="table-l2v"></div></div>
            <div><h3>Varaždin → Ludbreg</h3><div id="table-v2l"></div></div>
        </div>
    </details>
</main>

<script src="app.js"></script>
<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");</script>
</body>
</html>
